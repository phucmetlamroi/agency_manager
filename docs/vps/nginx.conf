# nginx cho HustlyTasker — BẢN VÁ BỔ SUNG, KHÔNG PHẢI BẢN THAY THẾ
#
# ⚠️ ĐỪNG chép đè cả file cấu hình đang chạy.
#
# Kiểm chứng ngày 24/08/2026 cho thấy nginx trên VPS ĐANG CẤU HÌNH TỐT ở hai
# điểm mà mặc định của nginx vốn nguy hiểm:
#
#   ✅ X-Real-IP đã được GHI ĐÈ đúng. Thử gửi `X-Real-IP: 203.0.113.77` từ ngoài
#      vào /api/log-client-error, máy chủ ghi lại IP công cộng THẬT của người gửi
#      chứ không phải header giả. Nghĩa là giới hạn tần suất theo IP và cột
#      LoginAttempt.ipAddress đều đáng tin. KHÔNG cần đụng vào.
#
#   ✅ client_max_body_size đã được nâng. POST 2MB đi lọt (mặc định nginx là 1MB,
#      sẽ trả 413). Upload ảnh bìa/avatar 10MB nhiều khả năng đã ổn — nhưng nếu
#      gặp lỗi thì nâng lên 25m theo khối dưới.
#
# Còn hai thứ CHƯA kiểm chứng được từ xa, và mặc định nginx sẽ làm hỏng cả hai.
# Đó là toàn bộ nội dung file này.
#
# Xem cấu hình hiện tại trước khi sửa:
#   sudo nginx -T | grep -nE 'client_max_body_size|proxy_read_timeout|proxy_buffering|X-Real-IP'
#
# Sau khi sửa:
#   sudo nginx -t && sudo systemctl reload nginx


# ══ 1. /api/inngest — mặc định 60s sẽ CẮT NGANG việc xử lý video ═════════════
#
# src/app/api/inngest/route.ts khai maxDuration = 800 giây. Con số đó có thật:
# bước `ensure-color-tags` STREAM cả video qua ffmpeg từ R2 → gắn lại thẻ màu →
# R2 trong MỘT lần gọi duy nhất.
#
# proxy_read_timeout mặc định của nginx là 60 GIÂY. Video dài hơn một phút xử lý
# là bị cắt giữa chừng: Inngest thấy lỗi mạng, job tính là thất bại, video kẹt
# "đang xử lý" và không ai biết vì sao.
#
# Đặt trong khối server của hustlytasker.xyz:

location = /api/inngest {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # 900s > 800s của ứng dụng, chừa biên an toàn.
    proxy_connect_timeout  10s;
    proxy_send_timeout     900s;
    proxy_read_timeout     900s;
}


# ══ 2. Hai route tải ZIP — TẮT ĐỆM ═══════════════════════════════════════════
#
# Hai route này stream nhiều GB qua tiến trình Node. nginx BẬT proxy_buffering
# theo mặc định, tức là nó hút cả tệp zip vào bộ nhớ/đĩa trước khi nhả cho khách.
#
# Chính comment đầu file src/app/api/review/download-zip/route.ts ghi lại một sự
# cố thật: tiến trình bị giết vì hết bộ nhớ với video 964MB. Cơ chế cứu nó là
# backpressure — trình nén chỉ đọc nhanh bằng tốc độ khách tải. Bật đệm là PHÁ
# đúng cơ chế đó: nginx hút hết sức mình, không quan tâm khách chậm hay nhanh.
#
# Trên VPS hậu quả nặng hơn Vercel: đó là CÙNG MỘT tiến trình Node phục vụ cả
# website, nên một người tải thư mục nặng làm sập site cho tất cả mọi người.

location ~ ^/api/(review/download-zip|share/[^/]+/download-zip) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Đây là hai dòng quan trọng nhất của cả file.
    proxy_buffering    off;
    proxy_request_buffering off;

    # Mạng khách chậm thì tải lâu là bình thường, không phải lỗi.
    proxy_connect_timeout 10s;
    proxy_send_timeout    0;
    proxy_read_timeout    0;

    # Đừng nén: tệp .zip đã ở chế độ STORE, nén lại là đốt CPU vô ích.
    gzip off;
}


# ══ 3. Ba route chậm — 300 giây ══════════════════════════════════════════════
# scan-folder: người dùng từng dán thư mục vài trăm tệp (comment trong route ghi
# rõ 90 giây không đủ). PDF hoá đơn: Chromium dựng trang.

location ~ ^/api/(integrations/scan-folder|share/[^/]+/invoices/[^/]+/pdf) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
}


# ══ 4. Nếu upload ảnh báo lỗi 413 ════════════════════════════════════════════
# Đặt ở cấp `server` (hoặc `http`). Đường upload lớn nhất khai 10MB trong code,
# 25m là dư cho phần overhead multipart.
#
#   client_max_body_size 25m;
#
# ⚠️ Nếu lỗi KHÔNG phải 413 của nginx mà là thông báo tiếng Việt của app, thì
#    trần nằm ở Next chứ không phải nginx: 5 đường upload ảnh là Server Action,
#    Next giới hạn 1MB mặc định và next.config.ts không khai
#    experimental.serverActions.bodySizeLimit. Trần đó GIỐNG HỆT trên Vercel —
#    không phải lỗi do chuyển máy chủ. Phân biệt bằng:
#      journalctl -u hustlytasker --since '2 min ago' | grep -i 'Body exceeded'


# ══ 5. Ba header BẮT BUỘC cho mọi location ═══════════════════════════════════
#
# X-Forwarded-Proto và X-Forwarded-Host không phải để cho đẹp:
#
#   • src/app/api/auth/verify-email/route.ts:84 dựng URL từ `req.nextUrl.origin`
#     (cố ý không dùng biến môi trường — đó là bản vá chống chuyển hướng hở).
#     Next dựng `origin` từ hai header này. Thiếu chúng, khách bấm link xác thực
#     email sẽ bị đá về http://localhost:3000 hoặc IP nội bộ.
#
#   • Thiếu X-Forwarded-Proto thì middleware chuyển hướng ra http://, rồi HSTS
#     trong next.config.ts ép quay lại https:// — thừa một vòng mỗi lần chuyển.
#
# Nếu cấu hình hiện tại đã có đủ (kiểm bằng `nginx -T | grep X-Forwarded`) thì
# không cần làm gì.
